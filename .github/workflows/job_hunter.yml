name: Job Hunter AI Engine - Scheduled Run

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 08:00 UTC (ajustable)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite ejecutar el bot manualmente desde el botón de GitHub

jobs:
  run-hunter:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout del Código
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 Ejecutar Job Hunter Engine
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python main.py

    - name: 💾 Guardar Actualizaciones en la Base de Datos Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add -f jobs.db
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update SQLite jobs database [skip ci]" && git pull --rebase -X theirs origin main && git push origin main)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}